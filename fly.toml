# fly.toml - Fly.io deployment configuration for Nucleus Engine
app = "nucleus-search-engine"
primary_region = "ord"

[build]
  dockerfile = "Containerfile.api"

[env]
  PORT = "8000"
  DATABASE_URL = "postgresql+asyncpg://nucleus:nucleus_secret@localhost:5432/nucleus_db"
  REDIS_URL = "redis://localhost:6379/0"
  LLM_BASE_URL = "https://api.openai.com/v1"
  EMBEDDING_PROVIDER = "local"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"
